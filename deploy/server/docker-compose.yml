# Medical RAG demo backing services on a single Linux server (docs/INSTALL.md). Demo only, not production-hardened:
# single node, OpenSearch security plugin off, every port bound to 127.0.0.1 so nothing is reachable from outside.
# Ports avoid the defaults (6379, 8123, 9200) in case the server already runs Redis, ClickHouse or OpenSearch.
# Run: sudo docker compose -p medrag --env-file /opt/medrag/medrag.env up -d
services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: medrag-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # The host keeps vm.max_map_count at 65530; with mmap off OpenSearch does not need it raised.
      - node.store.allow_mmap=false
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 4g
    cpus: 4
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - medrag-opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Short-term chat memory and per-user rate limits; no persistence.
  redis:
    image: redis:7.4.11-alpine
    container_name: medrag-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 512m
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chat history with TTL retention; password from /opt/medrag/medrag.env.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: medrag-clickhouse
    environment:
      - CLICKHOUSE_DB=medrag
      - CLICKHOUSE_USER=${MEDRAG_CLICKHOUSE_USER:-medrag}
      - CLICKHOUSE_PASSWORD=${MEDRAG_CLICKHOUSE_PASSWORD:?set MEDRAG_CLICKHOUSE_PASSWORD in /opt/medrag/medrag.env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - medrag-clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  medrag-opensearch-data:
  medrag-clickhouse-data:
