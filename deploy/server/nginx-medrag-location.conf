    # Medical RAG demo (docs/INSTALL.md). Paste INSIDE the `listen 443 ssl` server block of your site's nginx
    # config, ABOVE its `location / { ... }`. /medrag/ is a longer prefix than /, so the rest of the site is
    # unaffected.
    location = /medrag {
        return 301 /medrag/;
    }

    location /medrag/ {
        auth_basic           "Medical RAG demo";
        auth_basic_user_file /etc/nginx/medrag.htpasswd;

        proxy_pass http://127.0.0.1:8400/;      # trailing slash strips the /medrag prefix
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";  # the demo password stays at nginx
        proxy_cookie_path  / /medrag/;          # the anonymous chat cookie is scoped to the demo path

        proxy_buffering off;                    # the chat streams its stages and answer
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
